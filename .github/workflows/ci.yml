# =============================================================================
# CI — un job por proyecto, ninguno que despliegue
# =============================================================================
# El monorepo tiene dos proyectos que se prueban por separado: `ai-service/`
# (Python + FastAPI) y `business-backend/` (Next.js). Las reglas, en el orden
# en que importan:
#
#   1. SOLO SE RECONSTRUYE LO QUE CAMBIÓ. `changes` calcula los filtros una vez
#      y cada job depende de su resultado. Tocar una pantalla no debe levantar
#      un Postgres ni instalar Python.
#   2. NINGÚN JOB DESPLIEGA. Railway y Vercel despliegan desde GitHub por su
#      propia integración, con rollback incluido. Un job de deploy acá sería
#      reimplementar en YAML lo que las dos plataformas ya hacen.
#   3. NINGÚN SECRETO. Este pipeline no necesita ninguno: los tests que tocan
#      base se saltean solos cuando no hay una, y el chunking no necesita API
#      key —es determinístico y local—.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo a la misma rama cancela el anterior: la respuesta vieja ya no
# sirve. || A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Etapa 0 — ¿qué cambió?
  # ---------------------------------------------------------------------------
  changes:
    name: Detectar proyectos cambiados
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      business-backend: ${{ steps.filter.outputs.business-backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/ci.yml'
            business-backend:
              - 'business-backend/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Etapa 1 — servicio IA: lint + tests
  # ---------------------------------------------------------------------------
  ai-service:
    name: Servicio IA · lint & tests
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: Python 3.11
        run: uv python install 3.11

      # `--frozen` falla si uv.lock no coincide con pyproject.toml, así que CI
      # instala exactamente lo que fija el lockfile — la misma propiedad de la
      # que depende la imagen Docker.
      # || `--frozen` fails if uv.lock disagrees with pyproject.toml.
      - name: Dependencias
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Sin servicio de Postgres a propósito: los tests que necesitan base se
      # saltean diciendo por qué (está en el README del servicio). Los que
      # verifican el stemming español y el índice parcial NO corren acá, y eso
      # queda dicho en vez de disimulado.
      # || No Postgres service on purpose: the tests that need a database skip
      # themselves, saying so. The ones that verify Spanish stemming and the
      # partial index do NOT run here, and that is stated rather than hidden.
      - name: Tests
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # Etapa 2 — consola web: lint + build
  # ---------------------------------------------------------------------------
  business-backend:
    name: Consola web · lint & build
    needs: changes
    if: needs.changes.outputs.business-backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-backend

    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES que setup-node: `cache: pnpm` necesita el binario de pnpm
      # para resolver dónde está su store. Al revés, el paso de cache falla.
      # || pnpm BEFORE setup-node: `cache: pnpm` needs the pnpm binary to
      # resolve its store location. The other way around, the cache step fails.
      #
      # La versión sale de `packageManager` en package.json, así que CI y una
      # máquina con corepack instalan exactamente la misma.
      # || The version comes from `packageManager` in package.json, so CI and a
      # corepack machine install exactly the same one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: business-backend/pnpm-lock.yaml

      # `--frozen-lockfile` falla si pnpm-lock.yaml no coincide con
      # package.json — la misma propiedad que `--frozen` del lado de uv.
      # || `--frozen-lockfile` fails if pnpm-lock.yaml disagrees with
      # package.json -- the same property uv's `--frozen` gives on the Python side.
      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next build` corre TypeScript, así que el chequeo de tipos entra acá.
      # No hay AI_SERVICE_URL: el build no llama al servicio, y si algún día lo
      # hiciera, esta ausencia es la que lo haría fallar en vez de esconderlo.
      # || `next build` runs TypeScript, so type checking happens here. No
      # AI_SERVICE_URL: the build does not call the service, and if it ever did,
      # this absence is what would make it fail instead of hiding it.
      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Etapa 3 — validación de las specs
  # ---------------------------------------------------------------------------
  # Corre SIEMPRE, sin filtro de rutas: `openspec/` documenta los dos proyectos,
  # y un cambio en cualquiera de ellos puede dejar una spec desactualizada.
  # Stdlib puro, sin dependencias: no necesita ni uv ni instalar nada.
  #
  # || Runs ALWAYS, with no path filter: `openspec/` documents both projects.
  # Pure stdlib, no dependencies: it needs neither uv nor any install step.
  specs:
    name: OpenSpec · formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_specs.py
