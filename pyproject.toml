[project]
name = "visual-time-rag-service"
version = "0.1.0"
description = "Servicio IA: pipeline de ingesta y chunking de documentos funcionales de Visual Time para RAG con pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tiktoken>=0.7.0",
    # Required by FastAPI to parse multipart/form-data (UploadFile in /documents/ingest-file).
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
