[project]
name = "visual-time-rag-service"
version = "0.1.0"
description = "Servicio IA: pipeline de ingesta y chunking de documentos funcionales de Visual Time para RAG con pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tiktoken>=0.7.0",
    # Required by FastAPI to parse multipart/form-data (UploadFile in /documents/ingest-file).
    "python-multipart>=0.0.9",
    # Embedding layer: the OpenAI client, and numpy for the binary vector
    # sidecar (61901 x 1536 float32 = 380 MB; the same data as JSON is ~1.8 GB).
    "openai>=1.40",
    "numpy>=1.26",
    # pgvector store: SQLAlchemy 2.0 + Alembic as on the course's session_16.
    # psycopg3 drives the bulk COPY, asyncpg the query path; greenlet is what
    # SQLAlchemy's async engine needs outside Docker.
    # || Store pgvector: SQLAlchemy 2.0 + Alembic como en la session_16 del
    # curso. psycopg3 mueve el COPY masivo, asyncpg el camino de consulta;
    # greenlet es lo que el engine async de SQLAlchemy necesita fuera de Docker.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "greenlet>=3.0",
    # Corpus source over S3-compatible object storage (Railway, MinIO, AWS). The
    # S3 protocol requires signing every request with AWS SigV4, and writing
    # that by hand is home-made authentication cryptography. boto3 is the
    # reference client and talks to any S3-compatible endpoint via endpoint_url.
    # || Fuente del corpus sobre object storage S3-compatible (Railway, MinIO,
    # AWS). El protocolo S3 exige firmar cada request con AWS SigV4, y escribir
    # eso a mano es criptografia de autenticacion hecha en casa. boto3 es el
    # cliente de referencia y habla con cualquier endpoint S3-compatible por
    # endpoint_url.
    "boto3>=1.34",
    # Versioned prompts (`app/foundation/prompts/<name>/vN/*.j2`). StrictUndefined
    # so a missing variable fails instead of rendering empty — the same class of
    # defect as a chunk that produces zero text. Not in the repo before this;
    # `str.format` cannot express the course's versioned-prompt layout.
    # || Prompts versionados. No estaba en el repo; `str.format` no expresa el
    # layout versionado del curso.
    "jinja2>=3.1.6",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "anthropic>=1.3.0",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these itself; reformatting them adds churn on every
# autogenerate and would break env.py, whose app imports MUST come after the
# sys.path insert.
# || Alembic los escribe solo; reformatearlos agrega ruido en cada autogenerate
# y rompería env.py, cuyos imports de la app TIENEN que ir después del insert en
# sys.path.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `tests/foundation/llm/` can import `app.foundation.llm` without the
# mirrored directory stealing the import root. The rest of the suite already
# resolved `app` because those folders are not named like a top-level package
# the app itself uses.
# || Para que `tests/foundation/llm/` pueda importar `app.foundation.llm` sin
# que el directorio espejo se robe la raíz de imports.
pythonpath = ["."]
# `integration` needs a reachable Postgres with pgvector. Those tests skip
# themselves, saying so, when there is none: `pytest` stays fast and green with
# nothing installed, and `pytest -m integration` runs them for real.
# || `integration` necesita un Postgres con pgvector alcanzable. Esos tests se
# saltean, diciendolo, cuando no hay ninguno: `pytest` sigue rapido y verde sin
# nada instalado, y `pytest -m integration` los corre de verdad.
markers = [
    "integration: needs a reachable Postgres with pgvector (docker compose up -d)",
]
